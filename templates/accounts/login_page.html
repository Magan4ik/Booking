{% extends 'base/_base.html' %}
{% load crispy_forms_filters %}

{% block title %}Логін{% endblock title %}

{% block content %}

    <div class="container">
        <div class="row justify-content-center">
            <div class="card col-4 shadow-sm p-5 bg-body-tertiary rounded border-0">
                <h1>Login Page</h1>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary">Увійти</button>
                </form>
            </div>
        </div>
    </div>

{% endblock content %}
